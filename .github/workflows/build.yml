name: Build firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3]
    runs-on: ubuntu-latest
    # IDF v4.4 = the version that produced the working 22/09/2025 binary.
    # Do NOT bump to 5.x: the codebase uses 4.x APIs throughout.
    container: espressif/idf:release-v4.4
    steps:
      - uses: actions/checkout@v4

      # The IDF build runs `git describe` for the app version string;
      # inside a container the checkout is owned by a different user.
      - name: Fix git ownership
        run: git config --global --add safe.directory '*'

      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target ${{ matrix.target }}
          idf.py build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/esp32-xbee.bin
            build/www.bin
            build/flasher_args.json
