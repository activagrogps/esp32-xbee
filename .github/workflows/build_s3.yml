name: Build ESP32-S3

on:
  workflow_dispatch:      # Manual button only

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive  # Ensures all code parts are downloaded

    # This is the correct tool for C projects
    - name: Install ESP-IDF
      uses: espressif/install-esp-idf-action@v1
      with:
        version: v5.1.2
        targets: esp32s3

    - name: Build Firmware
      run: |
        idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults.esp32s3" build

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-gemini-firmware
        path: |
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/esp32-xbee.bin
          build/flasher_args.json
